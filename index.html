<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cam | تشخیص شکل و رنگ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101218;
  color: white;
  font-family: Tahoma, Arial, sans-serif;
  text-align: center;
}

header {
  padding: 20px 10px;
  background: #191d28;
  border-bottom: 1px solid #34394a;
}

h1 {
  font-size: 23px;
  margin: 0 0 10px;
}

main {
  max-width: 850px;
  margin: 20px auto;
  padding: 10px;
}

button {
  background: #ff9d00;
  color: #111;
  border: none;
  border-radius: 9px;
  padding: 13px 20px;
  margin: 5px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.camera {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #000;
  border: 2px solid #34394a;
  border-radius: 14px;
}

#video {
  display: block;
  width: 100%;
  height: auto;
  transform: scaleX(-1);
}

#overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: scaleX(-1);
  pointer-events: none;
}

#status {
  color: #ffc15a;
  line-height: 1.9;
  overflow-wrap: anywhere;
}

.panel {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 15px;
}

.card {
  background: #1b202c;
  border: 1px solid #34394a;
  border-radius: 12px;
  padding: 16px 8px;
}

.label {
  color: #aeb6ca;
  font-size: 13px;
  margin-bottom: 10px;
}

.value {
  font-size: 18px;
  overflow-wrap: anywhere;
}

#colorBox {
  display: inline-block;
  width: 25px;
  height: 25px;
  border: 1px solid white;
  border-radius: 5px;
  vertical-align: middle;
}

footer {
  padding: 20px;
  color: #858da1;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h1>تشخیص زنده شکل و رنگ</h1>
  <div>Cam | OpenCV.js</div>
</header>

<main>

  <button id="startBtn" disabled>
    در حال بارگذاری OpenCV...
  </button>

  <button id="stopBtn" disabled>
    خاموش کردن دوربین
  </button>

  <div class="camera">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <p id="status">در حال آماده‌سازی کتابخانه...</p>

  <section class="panel">

    <div class="card">
      <div class="label">تعداد شکل‌ها</div>
      <div class="value" id="shapeCount">۰</div>
    </div>

    <div class="card">
      <div class="label">شکل‌های تشخیص‌داده‌شده</div>
      <div class="value" id="shapeNames">---</div>
    </div>

    <div class="card">
      <div class="label">رنگ تقریبی مرکز تصویر</div>
      <div class="value" id="colorName">---</div>
    </div>

    <div class="card">
      <div class="label">نمونه رنگ و RGB</div>
      <span id="colorBox"></span>
      <span id="rgbValue">---</span>
    </div>

  </section>

</main>

<footer>
  پردازش تصویر در مرورگر انجام می‌شود.
</footer>

<script>
/*
  نکته:
  در این پروژه از cv.imread() استفاده نمی‌کنیم.
  تصویر دوربین را به Canvas می‌کشیم و داده‌های RGBA
  را مستقیماً در حافظه Mat قرار می‌دهیم.
*/

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const statusEl = document.getElementById("status");

const inputCanvas = document.createElement("canvas");
const inputCtx = inputCanvas.getContext("2d", {
  willReadFrequently: true
});

let stream = null;
let timer = null;
let cvReady = false;
let processing = false;
let lastError = "";

function setStatus(message) {
  statusEl.textContent = message;
}

/* آماده‌سازی OpenCV.js */

window.Module = {
  onRuntimeInitialized() {
    cvReady = true;
    startBtn.disabled = false;
    startBtn.textContent = "روشن کردن دوربین";
    setStatus("OpenCV.js آماده است.");
  }
};

/*
  برخی نسخه‌های OpenCV.js ممکن است callback را
  متفاوت اجرا کنند؛ این بررسی نیز آمادگی را کنترل می‌کند.
*/
const readyCheck = setInterval(() => {
  if (cvReady) {
    clearInterval(readyCheck);
    return;
  }

  try {
    if (
      window.cv &&
      cv.Mat &&
      cv.VideoCapture &&
      cv.CV_8UC4 !== undefined
    ) {
      cvReady = true;
      startBtn.disabled = false;
      startBtn.textContent = "روشن کردن دوربین";
      setStatus("OpenCV.js آماده است.");
      clearInterval(readyCheck);
    }
  } catch (_) {}
}, 300);

startBtn.addEventListener("click", startCamera);
stopBtn.addEventListener("click", stopCamera);

async function startCamera() {
  if (!cvReady) {
    setStatus("OpenCV.js هنوز آماده نشده است.");
    return;
  }

  if (stream) return;

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {
    setStatus(
      "دسترسی دوربین در این آدرس ممکن نیست. " +
      "از HTTPS یا localhost استفاده کنید."
    );
    return;
  }

  startBtn.disabled = true;

  try {
    setStatus("در انتظار اجازه دسترسی به دوربین...");

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      audio: false
    });

    video.srcObject = stream;

    await new Promise((resolve, reject) => {
      if (video.readyState >= 1 && video.videoWidth > 0) {
        resolve();
        return;
      }

      video.onloadedmetadata = resolve;

      video.onerror = () => {
        reject(new Error("تصویر دوربین بارگذاری نشد."));
      };
    });

    await video.play();

    const width = video.videoWidth;
    const height = video.videoHeight;

    inputCanvas.width = width;
    inputCanvas.height = height;

    overlay.width = width;
    overlay.height = height;

    stopBtn.disabled = false;
    startBtn.textContent = "دوربین فعال است";

    setStatus("دوربین روشن شد؛ در حال تشخیص شکل و رنگ...");

    timer = setInterval(processFrame, 250);

  } catch (error) {
    stopCamera(false);

    startBtn.disabled = false;
    startBtn.textContent = "تلاش دوباره";

    setStatus("خطای دوربین: " + error.message);
  }
}

function stopCamera(showMessage = true) {
  if (timer) {
    clearInterval(timer);
    timer = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;

  ctx.clearRect(0, 0, overlay.width, overlay.height);

  stopBtn.disabled = true;
  startBtn.disabled = !cvReady;
  startBtn.textContent = "روشن کردن دوربین";

  if (showMessage) {
    setStatus("دوربین خاموش است.");
  }
}

/* تشخیص شکل هندسی */

function classifyShape(contour) {
  const perimeter = cv.arcLength(contour, true);

  if (perimeter <= 0) {
    return null;
  }

  const approx = new cv.Mat();

  try {
    cv.approxPolyDP(
      contour,
      approx,
      perimeter * 0.035,
      true
    );

    const vertices = approx.rows;
    const area = cv.contourArea(contour);

    const circularity =
      (4 * Math.PI * area) /
      (perimeter * perimeter);

    if (vertices === 3) {
      return "مثلث";
    }

    if (vertices === 4) {
      const rect = cv.boundingRect(approx);

      const ratio =
        rect.width / Math.max(1, rect.height);

      if (ratio > 0.85 && ratio < 1.15) {
        return "مربع";
      }

      return "مستطیل";
    }

    if (vertices >= 5 && circularity > 0.76) {
      return "دایره";
    }

    if (vertices >= 5 && circularity > 0.55) {
      return "بیضی";
    }

    return null;

  } finally {
    approx.delete();
  }
}

/* تشخیص رنگ مرکز تصویر */

function detectColor(imageData) {
  const data = imageData.data;

  const cx = Math.floor(imageData.width / 2);
  const cy = Math.floor(imageData.height / 2);

  const index = (cy * imageData.width + cx) * 4;

  const r = data[index];
  const g = data[index + 1];
  const b = data[index + 2];

  const max = Math.max(r, g, b);
  const min = Math.min(r, g, b);

  let name;

  if (max < 45) {
    name = "سیاه";
  } else if (min > 210) {
    name = "سفید";
  } else if (max - min < 25) {
    name = max < 125 ? "خاکستری" : "خاکستری روشن";
  } else if (r >= g && r >= b) {
    name = g > b + 35 ? "نارنجی" : "قرمز";
  } else if (g >= r && g >= b) {
    name = r > b + 30 ? "زرد" : "سبز";
  } else {
    name = g > r + 30 ? "فیروزه‌ای" : "آبی";
  }

  document.getElementById("colorName").textContent = name;

  document.getElementById("colorBox").style.backgroundColor =
    `rgb(${r}, ${g}, ${b})`;

  document.getElementById("rgbValue").textContent =
    `${r}, ${g}, ${b}`;
}

/* تحلیل فریم دوربین */

function processFrame() {
  if (
    processing ||
    !stream ||
    video.readyState < 2 ||
    !video.videoWidth
  ) {
    return;
  }

  processing = true;

  let src = null;
  let gray = null;
  let blurred = null;
  let edges = null;
  let contours = null;
  let hierarchy = null;

  try {
    const width = video.videoWidth;
    const height = video.videoHeight;

    /*
      مرحله اول:
      فریم دوربین را مستقیماً به Canvas منتقل می‌کنیم.
      هیچ فراخوانی cv.imread() وجود ندارد.
    */

    inputCtx.drawImage(
      video,
      0,
      0,
      width,
      height
    );

    const imageData = inputCtx.getImageData(
      0,
      0,
      width,
      height
    );

    detectColor(imageData);

    /*
      مرحله دوم:
      داده‌های RGBA را مستقیماً در Mat کپی می‌کنیم.
    */

    src = new cv.Mat(
      height,
      width,
      cv.CV_8UC4
    );

    src.data.set(imageData.data);

    gray = new cv.Mat();
    blurred = new cv.Mat();
    edges = new cv.Mat();
    contours = new cv.MatVector();
    hierarchy = new cv.Mat();

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );

    cv.GaussianBlur(
      gray,
      blurred,
      new cv.Size(5, 5),
      0
    );

    cv.Canny(
      blurred,
      edges,
      55,
      140
    );

    cv.findContours(
      edges,
      contours,
      hierarchy,
      cv.RETR_EXTERNAL,
      cv.CHAIN_APPROX_SIMPLE
    );

    ctx.clearRect(
      0,
      0,
      overlay.width,
      overlay.height
    );

    ctx.font = "bold 18px Tahoma";
    ctx.lineWidth = 3;

    const found = [];
    let count = 0;

    for (let i = 0; i < contours.size(); i++) {
      const contour = contours.get(i);

      try {
        const area = cv.contourArea(contour);

        if (area < 900) {
          continue;
        }

        const name = classifyShape(contour);

        if (!name) {
          continue;
        }

        const rect = cv.boundingRect(contour);

        ctx.strokeStyle = "#00ff9d";

        ctx.strokeRect(
          rect.x,
          rect.y,
          rect.width,
          rect.height
        );

        ctx.fillStyle = "#00ff9d";

        ctx.fillText(
          name,
          rect.x + 5,
          Math.max(22, rect.y - 7)
        );

        found.push(name);
        count++;

      } finally {
        contour.delete();
      }
    }

    document.getElementById("shapeCount").textContent =
      String(count);

    document.getElementById("shapeNames").textContent =
      [...new Set(found)].join("، ") ||
      "شکلی پیدا نشد";

    setStatus("دوربین فعال است؛ تحلیل تصویر انجام می‌شود.");

  } catch (error) {
    const message = error.message || String(error);

    if (message !== lastError) {
      lastError = message;
      setStatus("خطای پردازش تصویر: " + message);
    }

  } finally {
    [
      src,
      gray,
      blurred,
      edges,
      contours,
      hierarchy
    ].forEach(mat => {
      if (mat) {
        mat.delete();
      }
    });

    processing = false;
  }
}
</script>

<!-- فایل باید در کنار index.html باشد. -->
<script async src="./opencv.js"></script>

</body>
</html>
