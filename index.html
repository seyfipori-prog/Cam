<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تشخیص شکل و رنگ | Cam</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101218;
  color: #fff;
  font-family: Tahoma, Arial, sans-serif;
  text-align: center;
}

header {
  padding: 22px 12px;
  background: #191d28;
}

h1 { font-size: 23px; }

main {
  max-width: 850px;
  margin: 20px auto;
  padding: 10px;
}

button {
  background: #ff9d00;
  color: #111;
  padding: 12px 20px;
  margin: 6px;
  border: 0;
  border-radius: 9px;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

.camera {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #000;
  border: 2px solid #34394a;
  border-radius: 14px;
}

video {
  display: block;
  width: 100%;
  height: auto;
  transform: scaleX(-1);
}

#overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  transform: scaleX(-1);
  pointer-events: none;
}

#status {
  color: #ffc15a;
  line-height: 1.9;
  overflow-wrap: anywhere;
}

.panel {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 15px;
}

.card {
  background: #1b202c;
  border: 1px solid #34394a;
  padding: 15px 8px;
  border-radius: 12px;
}

.label {
  color: #aeb6ca;
  font-size: 13px;
  margin-bottom: 10px;
}

.value {
  font-size: 18px;
  overflow-wrap: anywhere;
}

#colorBox {
  display: inline-block;
  width: 24px;
  height: 24px;
  vertical-align: middle;
  border: 1px solid white;
  border-radius: 5px;
}

footer {
  padding: 20px;
  color: #858da1;
  font-size: 12px;
}
</style>
</head>

<body>
<header>
  <h1>تشخیص زنده شکل و رنگ</h1>
  <div>Cam | OpenCV.js</div>
</header>

<main>
  <button id="startBtn" disabled>در حال آماده‌سازی...</button>
  <button id="stopBtn" disabled>خاموش کردن دوربین</button>

  <div class="camera">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <p id="status">در حال بارگذاری OpenCV.js...</p>

  <section class="panel">
    <div class="card">
      <div class="label">تعداد شکل‌ها</div>
      <div class="value" id="shapeCount">۰</div>
    </div>

    <div class="card">
      <div class="label">شکل‌های تشخیص‌داده‌شده</div>
      <div class="value" id="shapeNames">---</div>
    </div>

    <div class="card">
      <div class="label">رنگ تقریبی تصویر</div>
      <div class="value" id="colorName">---</div>
    </div>

    <div class="card">
      <div class="label">نمونه رنگ و RGB</div>
      <span id="colorBox"></span>
      <span id="rgbValue">---</span>
    </div>
  </section>
</main>

<footer>
پردازش تصویر در مرورگر انجام می‌شود.
</footer>

<script>
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const statusEl = document.getElementById("status");

let stream = null;
let timer = null;
let cvReady = false;
let processing = false;

function status(text) {
  statusEl.textContent = text;
}

// OpenCV.js باید پس از بارگذاری کامل آماده شود.
window.Module = {
  onRuntimeInitialized() {
    cvReady = true;
    startBtn.disabled = false;
    startBtn.textContent = "روشن کردن دوربین";
    status("OpenCV.js آماده است.");
  }
};

function checkOpenCV() {
  if (cvReady || !window.cv) return;

  try {
    if (cv.Mat && cv.VideoCapture && cv.CV_8UC4 !== undefined) {
      cvReady = true;
      startBtn.disabled = false;
      startBtn.textContent = "روشن کردن دوربین";
      status("OpenCV.js آماده است.");
    }
  } catch (_) {}
}

const cvTimer = setInterval(() => {
  checkOpenCV();
  if (cvReady) clearInterval(cvTimer);
}, 300);

startBtn.addEventListener("click", startCamera);
stopBtn.addEventListener("click", stopCamera);

async function startCamera() {
  if (!cvReady) {
    status("کتابخانه هنوز آماده نیست.");
    return;
  }

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    status("دوربین در این محیط پشتیبانی نمی‌شود. از HTTPS استفاده کنید.");
    return;
  }

  startBtn.disabled = true;

  try {
    status("در انتظار اجازه دسترسی به دوربین...");

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      audio: false
    });

    video.srcObject = stream;

    await new Promise((resolve, reject) => {
      if (video.readyState >= 1 && video.videoWidth) {
        resolve();
        return;
      }

      video.onloadedmetadata = resolve;
      video.onerror = () => reject(
        new Error("بارگذاری تصویر دوربین ناموفق بود.")
      );
    });

    await video.play();

    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;

    stopBtn.disabled = false;
    startBtn.textContent = "دوربین فعال است";

    status("دوربین روشن شد؛ در حال تحلیل تصویر...");

    timer = setInterval(processFrame, 300);

  } catch (error) {
    startBtn.disabled = false;
    startBtn.textContent = "تلاش دوباره";

    status("خطا: " + error.message);
    stopCamera(false);
  }
}

function stopCamera(updateStatus = true) {
  if (timer) clearInterval(timer);
  timer = null;

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  stream = null;
  video.srcObject = null;

  ctx.clearRect(0, 0, overlay.width, overlay.height);

  stopBtn.disabled = true;
  startBtn.disabled = !cvReady;
  startBtn.textContent = "روشن کردن دوربین";

  if (updateStatus) status("دوربین خاموش است.");
}

function classifyShape(contour) {
  const perimeter = cv.arcLength(contour, true);

  if (perimeter < 1) return null;

  const approx = new cv.Mat();

  try {
    cv.approxPolyDP(
      contour,
      approx,
      0.035 * perimeter,
      true
    );

    const vertices = approx.rows;
    const area = cv.contourArea(contour);
    const circularity =
      (4 * Math.PI * area) / (perimeter * perimeter);

    if (vertices === 3) return "مثلث";

    if (vertices === 4) {
      const rect = cv.boundingRect(approx);
      const ratio = rect.width / rect.height;

      return ratio > 0.85 && ratio < 1.15
        ? "مربع"
        : "مستطیل";
    }

    if (vertices >= 5 && circularity > 0.75) {
      return "دایره";
    }

    if (vertices >= 5 && circularity > 0.55) {
      return "بیضی";
    }

    return null;

  } finally {
    approx.delete();
  }
}

function detectColor(src) {
  // نمونه‌برداری از مرکز تصویر
  const x = Math.floor(src.cols / 2);
  const y = Math.floor(src.rows / 2);

  const pixel = src.ucharPtr(y, x);

  const r = pixel[0];
  const g = pixel[1];
  const b = pixel[2];

  const max = Math.max(r, g, b);
  const min = Math.min(r, g, b);

  let name;

  if (max < 45) {
    name = "سیاه";
  } else if (min > 210) {
    name = "سفید";
  } else if (max - min < 25) {
    name = max < 125 ? "خاکستری" : "خاکستری روشن";
  } else if (r >= g && r >= b) {
    name = g > b + 35 ? "نارنجی" : "قرمز";
  } else if (g >= r && g >= b) {
    name = r > b + 30 ? "زرد" : "سبز";
  } else {
    name = g > r + 30 ? "فیروزه‌ای" : "آبی";
  }

  document.getElementById("colorName").textContent = name;

  document.getElementById("colorBox").style.backgroundColor =
    `rgb(${r}, ${g}, ${b})`;

  document.getElementById("rgbValue").textContent =
    `${r}, ${g}, ${b}`;
}

function processFrame() {
  if (processing || !stream || video.readyState < 2) return;

  processing = true;

  let src = null;
  let gray = null;
  let blurred = null;
  let edges = null;
  let contours = null;
  let hierarchy = null;
  let cap = null;

  try {
    // خواندن فریم دوربین با VideoCapture
    src = new cv.Mat(
      video.videoHeight,
      video.videoWidth,
      cv.CV_8UC4
    );

    cap = new cv.VideoCapture(video);
    cap.read(src);

    if (src.empty()) return;

    detectColor(src);

    gray = new cv.Mat();
    blurred = new cv.Mat();
    edges = new cv.Mat();
    contours = new cv.MatVector();
    hierarchy = new cv.Mat();

    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

    cv.GaussianBlur(
      gray,
      blurred,
      new cv.Size(5, 5),
      0
    );

    cv.Canny(blurred, edges, 55, 140);

    cv.findContours(
      edges,
      contours,
      hierarchy,
      cv.RETR_EXTERNAL,
      cv.CHAIN_APPROX_SIMPLE
    );

    ctx.clearRect(0, 0, overlay.width, overlay.height);

    const found = [];
    let count = 0;

    for (let i = 0; i < contours.size(); i++) {
      const contour = contours.get(i);

      try {
        if (cv.contourArea(contour) < 900) continue;

        const name = classifyShape(contour);
        if (!name) continue;

        const rect = cv.boundingRect(contour);

        ctx.strokeStyle = "#00ff9d";
        ctx.lineWidth = 3;

        ctx.strokeRect(
          rect.x,
          rect.y,
          rect.width,
          rect.height
        );

        ctx.fillStyle = "#00ff9d";
        ctx.font = "bold 18px Tahoma";

        ctx.fillText(
          name,
          rect.x + 5,
          Math.max(22, rect.y - 7)
        );

        found.push(name);
        count++;

      } finally {
        contour.delete();
      }
    }

    document.getElementById("shapeCount").textContent =
      String(count);

    document.getElementById("shapeNames").textContent =
      [...new Set(found)].join("، ") || "شکلی پیدا نشد";

    status("تشخیص زنده فعال است.");

  } catch (error) {
    status("خطای پردازش تصویر: " + error.message);

  } finally {
    [
      src,
      gray,
      blurred,
      edges,
      contours,
      hierarchy
    ].forEach(mat => {
      if (mat) mat.delete();
    });

    processing = false;
  }
}
</script>

<script async src="./opencv.js"></script>
</body>
</html>
