<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تشخیص شکل و رنگ با هوش مصنوعی</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101218;
      color: #fff;
      font-family: Tahoma, Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 20px;
      background: #191d28;
      border-bottom: 1px solid #34394a;
    }

    h1 { font-size: 23px; margin: 0 0 8px; }
    p { color: #b7bdce; font-size: 14px; }

    main {
      width: min(950px, 96%);
      margin: 20px auto;
    }

    .camera {
      position: relative;
      overflow: hidden;
      background: #000;
      border: 2px solid #383e50;
      border-radius: 16px;
      min-height: 220px;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: scaleX(-1);
    }

    button {
      background: #ff9d00;
      color: #111;
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      margin: 12px 5px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .card {
      background: #1b202c;
      border: 1px solid #34394a;
      border-radius: 12px;
      padding: 16px 10px;
    }

    .label {
      color: #aeb6ca;
      font-size: 13px;
      margin-bottom: 9px;
    }

    .value {
      font-size: 19px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    #colorBox {
      width: 35px;
      height: 35px;
      display: inline-block;
      vertical-align: middle;
      border-radius: 8px;
      border: 1px solid #aaa;
      margin-left: 8px;
    }

    #status {
      color: #ffc15a;
      padding: 12px;
      line-height: 1.8;
    }

    footer {
      color: #858da1;
      padding: 20px;
      font-size: 12px;
    }
  </style>
</head>

<body>
<header>
  <h1>تشخیص زنده شکل و رنگ</h1>
  <p>پردازش تصویر دوربین با OpenCV.js</p>
</header>

<main>
  <button id="startBtn" disabled>در حال بارگذاری کتابخانه...</button>
  <button id="stopBtn" disabled>خاموش کردن دوربین</button>

  <div class="camera">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">در حال بارگذاری OpenCV.js ...</div>

  <section class="panel">
    <div class="card">
      <div class="label">شکل‌های تشخیص‌داده‌شده</div>
      <div class="value" id="shapeCount">۰</div>
    </div>

    <div class="card">
      <div class="label">شکل‌های موجود</div>
      <div class="value" id="shapeNames">---</div>
    </div>

    <div class="card">
      <div class="label">رنگ غالب تقریبی</div>
      <div class="value" id="colorName">---</div>
    </div>

    <div class="card">
      <div class="label">نمونه رنگ</div>
      <span id="colorBox"></span>
      <span id="rgbValue">---</span>
    </div>
  </section>
</main>

<footer>
  پردازش تصویر در مرورگر انجام می‌شود.
</footer>

<script>
  const video = document.getElementById("video");
  const canvas = document.getElementById("overlay");
  const ctx = canvas.getContext("2d");

  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const statusEl = document.getElementById("status");

  let stream = null;
  let timer = null;
  let cvReady = false;
  let processing = false;

  function setStatus(text) {
    statusEl.textContent = text;
  }

  // منتظر آماده‌شدن OpenCV.js می‌مانیم.
  window.Module = {
    onRuntimeInitialized() {
      cvReady = true;
      startBtn.disabled = false;
      startBtn.textContent = "روشن کردن دوربین";
      setStatus("کتابخانه آماده است. دوربین را روشن کنید.");
    }
  };

  // اگر فایل محلی Module را نادیده گرفت، آماده‌شدن را بررسی می‌کنیم.
  const cvCheck = setInterval(() => {
    if (window.cv && cv.Mat && !cvReady) {
      try {
        if (cv.getBuildInformation) {
          cv.getBuildInformation();
          cvReady = true;
          startBtn.disabled = false;
          startBtn.textContent = "روشن کردن دوربین";
          setStatus("OpenCV.js آماده است.");
          clearInterval(cvCheck);
        }
      } catch (_) {}
    }
  }, 300);

  startBtn.addEventListener("click", startCamera);
  stopBtn.addEventListener("click", stopCamera);

  async function startCamera() {
    if (!cvReady) {
      setStatus("هنوز OpenCV.js آماده نشده است.");
      return;
    }

    try {
      startBtn.disabled = true;
      setStatus("در انتظار اجازه دسترسی به دوربین...");

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment",
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });

      video.srcObject = stream;

      await new Promise(resolve => {
        video.onloadedmetadata = resolve;
      });

      await video.play();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      stopBtn.disabled = false;
      startBtn.textContent = "دوربین روشن است";
      setStatus("دوربین فعال است؛ در حال تشخیص شکل و رنگ...");

      timer = setInterval(processFrame, 350);

    } catch (error) {
      startBtn.disabled = false;
      startBtn.textContent = "تلاش دوباره";

      setStatus(
        "خطای دوربین: " + error.message +
        " | صفحه را با HTTPS یا localhost باز کنید و اجازه دوربین بدهید."
      );
    }
  }

  function stopCamera() {
    if (timer) clearInterval(timer);
    timer = null;

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    stream = null;
    video.srcObject = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    stopBtn.disabled = true;
    startBtn.disabled = !cvReady;
    startBtn.textContent = "روشن کردن دوربین";

    setStatus("دوربین خاموش است.");
  }

  function classifyShape(contour) {
    const perimeter = cv.arcLength(contour, true);
    if (perimeter <= 0) return null;

    const approx = new cv.Mat();
    cv.approxPolyDP(contour, approx, 0.035 * perimeter, true);

    const vertices = approx.rows;
    const area = cv.contourArea(contour);
    const circularity = (4 * Math.PI * area) / (perimeter * perimeter);

    let name = null;

    if (vertices === 3) {
      name = "مثلث";
    } else if (vertices === 4) {
      const rect = cv.boundingRect(approx);
      const ratio = rect.width / rect.height;

      name = ratio > 0.85 && ratio < 1.15
        ? "مربع"
        : "مستطیل";
    } else if (vertices >= 5 && circularity > 0.72) {
      name = "دایره";
    } else if (vertices >= 5 && circularity > 0.55) {
      name = "بیضی";
    }

    approx.delete();
    return name;
  }

  function detectColor(mat) {
    const small = new cv.Mat();
    cv.resize(mat, small, new cv.Size(1, 1), 0, 0, cv.INTER_AREA);

    const pixel = small.ucharPtr(0, 0);
    const b = pixel[0];
    const g = pixel[1];
    const r = pixel[2];

    small.delete();

    let name;

    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);

    if (max < 45) {
      name = "سیاه";
    } else if (min > 210) {
      name = "سفید";
    } else if (max - min < 25) {
      name = max < 125 ? "خاکستری" : "خاکستری روشن";
    } else if (r >= g && r >= b) {
      name = g > b + 35 ? "نارنجی" : "قرمز";
    } else if (g >= r && g >= b) {
      name = r > b + 30 ? "زرد" : "سبز";
    } else {
      name = g > r + 30 ? "فیروزه‌ای" : "آبی";
    }

    document.getElementById("colorName").textContent = name;
    document.getElementById("colorBox").style.backgroundColor =
      `rgb(${r}, ${g}, ${b})`;
    document.getElementById("rgbValue").textContent =
      `${r}, ${g}, ${b}`;
  }

  function processFrame() {
    if (processing || video.readyState < 2 || !cvReady) return;
    processing = true;

    let src, gray, blurred, edges, contours, hierarchy;

    try {
      src = cv.imread(video);

      // تشخیص رنگ تقریبی کل تصویر.
      detectColor(src);

      gray = new cv.Mat();
      blurred = new cv.Mat();
      edges = new cv.Mat();
      contours = new cv.MatVector();
      hierarchy = new cv.Mat();

      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
      cv.Canny(blurred, edges, 55, 140);

      cv.findContours(
        edges,
        contours,
        hierarchy,
        cv.RETR_EXTERNAL,
        cv.CHAIN_APPROX_SIMPLE
      );

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const found = [];
      let count = 0;

      for (let i = 0; i < contours.size(); i++) {
        const contour = contours.get(i);
        const area = cv.contourArea(contour);

        if (area < 900) {
          contour.delete();
          continue;
        }

        const name = classifyShape(contour);

        if (name) {
          const rect = cv.boundingRect(contour);

          ctx.strokeStyle = "#00ff9d";
          ctx.lineWidth = 3;
          ctx.strokeRect(rect.x, rect.y, rect.width, rect.height);

          ctx.fillStyle = "#00ff9d";
          ctx.font = "bold 18px Tahoma";
          ctx.fillText(name, rect.x + 5, Math.max(22, rect.y - 7));

          found.push(name);
          count++;
        }

        contour.delete();
      }

      document.getElementById("shapeCount").textContent = count;
      document.getElementById("shapeNames").textContent =
        [...new Set(found)].join("، ") || "شکلی پیدا نشد";

      setStatus("تشخیص زنده فعال است.");

    } catch (error) {
      setStatus("خطا در پردازش تصویر: " + error.message);
    } finally {
      [src, gray, blurred, edges, contours, hierarchy]
        .forEach(mat => {
          if (mat) mat.delete();
        });

      processing = false;
    }
  }
</script>

<script async src="./opencv.js"></script>
</body>
</html>
